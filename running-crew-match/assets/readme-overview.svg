<svg width="1200" height="520" viewBox="0 0 1200 520" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="520" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="1" stop-color="#ECFDF5"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0F766E"/>
      <stop offset="1" stop-color="#22C55E"/>
    </linearGradient>
    <filter id="shadow" x="0" y="0" width="1200" height="520" filterUnits="userSpaceOnUse" color-interpolation-filters="sRGB">
      <feDropShadow dx="0" dy="12" stdDeviation="18" flood-color="#0F172A" flood-opacity="0.10"/>
    </filter>
  </defs>

  <rect x="20" y="20" width="1160" height="480" rx="28" fill="url(#bg)"/>
  <rect x="20" y="20" width="1160" height="480" rx="28" stroke="#D1FAE5"/>

  <text x="70" y="92" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Running Crew Match</text>
  <text x="70" y="128" fill="#475569" font-family="Arial, Helvetica, sans-serif" font-size="19">A local-first demo skill that turns runner preferences into crew recommendations.</text>

  <g filter="url(#shadow)">
    <rect x="70" y="175" width="240" height="90" rx="22" fill="#FFFFFF"/>
    <text x="100" y="212" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Input 1</text>
    <text x="100" y="245" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Area</text>
    <text x="100" y="272" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="16">Seongsu, Jamsil, Busan...</text>

    <rect x="70" y="285" width="240" height="90" rx="22" fill="#FFFFFF"/>
    <text x="100" y="322" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Input 2</text>
    <text x="100" y="355" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Day &amp; Time</text>
    <text x="100" y="382" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="16">Weekday evening, weekend morning</text>

    <rect x="70" y="395" width="240" height="90" rx="22" fill="#FFFFFF"/>
    <text x="100" y="432" fill="#0F766E" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Input 3</text>
    <text x="100" y="465" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Level &amp; Goal</text>
    <text x="100" y="492" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="16">Beginner, social, half-marathon</text>
  </g>

  <path d="M344 330H460" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <path d="M440 308L478 330L440 352" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="470" y="175" width="260" height="310" rx="32" fill="url(#accent)"/>
    <text x="520" y="230" fill="#D1FAE5" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Engine</text>
    <text x="520" y="280" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="36" font-weight="700">Demo Matcher</text>
    <text x="520" y="320" fill="#ECFDF5" font-family="Arial, Helvetica, sans-serif" font-size="18">Local CLI</text>
    <text x="520" y="350" fill="#ECFDF5" font-family="Arial, Helvetica, sans-serif" font-size="18">Local API</text>
    <text x="520" y="380" fill="#ECFDF5" font-family="Arial, Helvetica, sans-serif" font-size="18">Later: Brev deployment</text>

    <rect x="520" y="405" width="160" height="46" rx="23" fill="#ECFDF5" fill-opacity="0.18"/>
    <text x="550" y="434" fill="#FFFFFF" font-family="Arial, Helvetica, sans-serif" font-size="18" font-weight="700">Local-first flow</text>
  </g>

  <path d="M744 330H860" stroke="#94A3B8" stroke-width="8" stroke-linecap="round"/>
  <path d="M840 308L878 330L840 352" stroke="#94A3B8" stroke-width="8" stroke-linecap="round" stroke-linejoin="round"/>

  <g filter="url(#shadow)">
    <rect x="870" y="175" width="260" height="90" rx="22" fill="#FFFFFF"/>
    <text x="900" y="212" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Output 1</text>
    <text x="900" y="245" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Crew Candidates</text>
    <text x="900" y="272" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="16">Top matches for the runner</text>

    <rect x="870" y="285" width="260" height="90" rx="22" fill="#FFFFFF"/>
    <text x="900" y="322" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Output 2</text>
    <text x="900" y="355" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Why It Fits</text>
    <text x="900" y="382" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="16">Region, schedule, and goal matching</text>

    <rect x="870" y="395" width="260" height="90" rx="22" fill="#FFFFFF"/>
    <text x="900" y="432" fill="#16A34A" font-family="Arial, Helvetica, sans-serif" font-size="17" font-weight="700">Output 3</text>
    <text x="900" y="465" fill="#0F172A" font-family="Arial, Helvetica, sans-serif" font-size="28" font-weight="700">Source &amp; Freshness</text>
    <text x="900" y="492" fill="#64748B" font-family="Arial, Helvetica, sans-serif" font-size="16">Demo data now, live sources later</text>
  </g>
</svg>
